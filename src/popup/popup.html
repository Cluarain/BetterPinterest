<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BetterPinterest</title>
    <link rel="stylesheet" href="popup.css" />
    <!-- Dark theme (html.pt-dark) for the control panel — the same
         master.css the content script injects into Pinterest pages. -->
    <link rel="stylesheet" href="../content/styles/master.css" />
  </head>
  <body>
    <header class="header">
      <a href="https://pinterest.com" target="_blank" class="logo" aria-hidden="true"></a>
      <div class="header-text">
        <h1 class="title">BetterPinterest</h1>
        <p class="subtitle">Little UI tweaks</p>
      </div>
    </header>

    <main id="featureList" class="list" aria-label="BetterPinterest toggles">
      <!-- feature rows are rendered by popup.js -->
    </main>

    <footer class="footer">
      <span id="status" class="status">
        
      </span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
